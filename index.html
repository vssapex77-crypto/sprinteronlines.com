    <!-- =====================================================
         TELEGRAM TRACKING
    ====================================================== -->

    <script>

    document.addEventListener(
        'DOMContentLoaded',
        function () {


            /* ================================================
               GET TELEGRAM LINK
            ================================================ */

            var telegramLink =
                document.getElementById(
                    'telegram-logo-link'
                );


            /* ================================================
               TELEGRAM CLICK EVENT
            ================================================ */

            if (telegramLink) {

                telegramLink.addEventListener(
                    'click',
                    function () {

                        /*
                         * TelegramClick is sent to
                         * both initialized Pixels.
                         */

                        fbq(
                            'track',
                            'TelegramClick'
                        );

                    }
                );

            }


            /* ================================================
               AUTOMATIC TELEGRAM REDIRECT
            ================================================ */

            setTimeout(
                function () {


                    /*
                     * Track visitor before redirect.
                     */

                    fbq(
                        'track',
                        'TelegramRedirect'
                    );


                    /*
                     * Wait 500ms so the event
                     * has time to start sending.
                     */

                    setTimeout(
                        function () {

                            window.location.href =
                                'https://t.me/sprinteronlineid';

                        },
                        500
                    );


                },
                1000
            );


        }
    );

    </script>
