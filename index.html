<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprinter Online Gaming</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- Meta Pixel Code -->

<body>
<section class="home">
    <div class="home-inner">
        <div class="head-title">
            <div class="logo-box">
                <a href="https://t.me/sprinteruserid
                   id="telegram-logo-link">
                    <img
                        src="assets/images/sprinterslogo.png"
                        alt="Sprinter Online Gaming"
                    >
                </a>
            </div>
            <div class="top-content-bx">
                <div class="white-box">
                    <h2>ASIA’S LARGEST BOOK</h2>
                </div>
                <h1>Sprinter Online Book</h1>
                <p class="line-text">
                    <span class="line"></span>
                    <span class="text">Since 2010</span>
                    <span class="line"></span>
                </p>
            </div>
        </div>
        <div class="center-part">
            <div class="middle-text-box">
                <h3>Official Online Gaming Platform</h3>
            </div>
        </div>
        <div class="btm-part">
            <div class="btm-content-bx">
                <a
                    href="https://t.me/spinteruserid
                    id="telegram-button"
                    class="zoom-in"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <img
                        src="assets/images/get-id.png"
                        alt="Continue to Telegram"
                    >
                </a>
            </div>
            <div class="boxes">
                <div class="box golden-gradient">
                    <span>24 Hour Refill</span>
                </div>
                <div class="box golden-gradient">
                    <span>24 Hour Return</span>
                </div>
            </div>
            <div class="btm-img">
                <img
                    src="assets/images/bottom-sports-img.png"
                    alt="Sports"
                >
            </div>
        </div>
    </div>
</section>
<!-- Telegram click tracking -->
<script>
document.getElementById('telegram-button').addEventListener('click', function () {
    if (typeof fbq === 'function') {
        fbq('track', 'Lead');
    }
});
</script>
