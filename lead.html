<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sprinter Online | Official Access</title>
  <!-- Global site tag (gtag.js) - Google Ads -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-CONVERSION_ID"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'AW-CONVERSION_ID');

    // THIS FUNCTION TRIGGERS THE LEAD CONVERSION
    function trackLead() {
      gtag('event', 'conversion', {'send_to': 'AW-CONVERSION_ID/CONVERSION_LABEL'});
      document.getElementById('leadForm').style.display = 'none';
      document.getElementById('successView').style.display = 'block';
      return false;
    }
  </script>
  <style>
    body { font-family: -apple-system, sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 20px; }
    .card { background: white; padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
    input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
    .btn { background: #0088cc; color: white; border: none; padding: 15px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; display: block; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sprinter Online</h1>

    <!-- STEP 1: LEAD FORM -->
    <div id="leadForm">
      <p>Enter your details to get the Telegram link.</p>
      <form onsubmit="return trackLead();">
        <input type="text" name="name" placeholder="Full Name" required>
        <input type="tel" name="phone" placeholder="Phone Number" required>
        <button type="submit" class="btn">GET TELEGRAM LINK</button>
      </form>
    </div>

    <!-- STEP 2: SUCCESS VIEW -->
    <div id="successView" style="display:none;">
      <h2>Success!</h2>
      <p>You're registered. Click below to join.</p>
      <a href="https://t.me/sprinteronlineid" class="btn">OPEN TELEGRAM CHANNEL</a>
    </div>

    <p style="font-size:12px; color:#888; margin-top:20px;">By joining, you agree to our <a href="/privacy">Privacy Policy</a>.</p>
  </div>
</body>
</html>
